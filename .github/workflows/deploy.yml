# Deployment der Website davinci-homes.de zu SiteGround per SSH.
# Läuft bei jedem Push auf "main" und manuell über Actions → "Deploy" → "Run workflow".
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   SG_HOST  SSH-Hostname aus SiteGround (Site Tools → Devs → SSH Keys Manager → „SSH-Zugangsdaten“)
#   SG_USER  SSH-Benutzername (z. B. u1234-abcdef)
#   SG_PORT  SSH-Port (bei SiteGround meist 18765)
#   SG_PATH  Zielordner, z. B. www/davinci-homes.de/public_html
#   SG_KEY   privater SSH-Schlüssel OHNE Passphrase (der öffentliche Teil ist in SiteGround importiert)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secrets prüfen
        id: check
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_KEY: ${{ secrets.SG_KEY }}
        run: |
          if [ -z "$SG_HOST" ] || [ -z "$SG_KEY" ]; then
            echo "Die Secrets für SiteGround fehlen noch. Deployment wird übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Eingaben bereinigen
        if: steps.check.outputs.ok == 'true'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          # Leerzeichen/Zeilenumbrüche entfernen, "ssh ", "-p 18765" und "user@" aus dem Hostnamen herauslösen
          H=$(printf '%s' "$SG_HOST" | sed -E 's/^[[:space:]]*ssh[[:space:]]+//; s#^[a-z]+://##' | tr -d '[:space:]'); U=$(printf '%s' "$SG_USER" | tr -d '[:space:]'); P=$(printf '%s' "$SG_PORT" | tr -dc '0-9')
          case "$H" in *-p[0-9]*) [ -z "$P" ] && P=$(printf '%s' "$H" | sed -E 's/.*-p([0-9]+).*/\1/'); H=$(printf '%s' "$H" | sed -E 's/-p[0-9]+//') ;; esac
          case "$H" in *@*) [ -z "$U" ] && U=${H%@*}; H=${H#*@} ;; esac
          case "$U" in *@*) U=${U%@*} ;; esac
          H=${H%%:*}
          D=$(printf '%s' "$SG_PATH" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s#^~/##; s#/$##')
          echo "::add-mask::$H"; echo "::add-mask::$U"
          { echo "H=$H"; echo "U=$U"; echo "P=${P:-18765}"; echo "D=$D"; } >> "$GITHUB_ENV"
          if ! printf '%s' "$H" | grep -Eq '^[A-Za-z0-9.-]+$'; then echo "::error::SG_HOST enthält ungültige Zeichen. Bitte nur den Hostnamen eintragen, z. B. ssh.davinci-homes.de oder eine IP-Adresse."; exit 1; fi
          if ! printf '%s' "$U" | grep -Eq '^[A-Za-z0-9._-]+$'; then echo "::error::SG_USER enthält ungültige Zeichen. Bitte nur den Benutzernamen eintragen, z. B. u1234-abcdef."; exit 1; fi
          echo "Eingaben in Ordnung (Host ${#H} Zeichen, Benutzer ${#U} Zeichen, Port ${P:-18765}, Pfad ${D})"

      - name: SSH einrichten
        if: steps.check.outputs.ok == 'true'
        env:
          SG_KEY: ${{ secrets.SG_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$P" "$H" >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Server nicht erreichbar: SG_HOST oder SG_PORT stimmt nicht (Hostname aus SiteGround → SSH-Zugangsdaten, Port meist 18765)."
            exit 1
          fi
          if ! head -n1 ~/.ssh/id_deploy | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "::error::SG_KEY ist kein privater Schlüssel. Bitte den Inhalt von ~/.ssh/davinci_deploy (ohne .pub) komplett einfügen, inklusive der BEGIN- und END-Zeile."
            exit 1
          fi

      - name: Verbindung testen
        if: steps.check.outputs.ok == 'true'
        run: |
          if ! out=$(ssh -i ~/.ssh/id_deploy -p "$P" -o BatchMode=yes -o ConnectTimeout=20 "$U@$H" "echo verbunden; test -d \"$D\" && echo pfad-ok || echo pfad-fehlt; command -v rsync >/dev/null && echo rsync-ok || echo rsync-fehlt" 2>&1); then
            if echo "$out" | grep -qi "permission denied"; then
              echo "::error::Anmeldung abgelehnt: SG_USER stimmt nicht oder der öffentliche Schlüssel ist in SiteGround nicht importiert."
            else
              echo "::error::SSH-Verbindung fehlgeschlagen: $(echo "$out" | tail -n 2 | tr '\n' ' ')"
            fi
            exit 1
          fi
          echo "$out"
          if echo "$out" | grep -q pfad-fehlt; then
            echo "::error::Zielordner nicht gefunden. SG_PATH prüfen, z. B. www/davinci-homes.de/public_html. Vorhanden in www/: $(ssh -i ~/.ssh/id_deploy -p "$P" -o BatchMode=yes "$U@$H" 'ls www 2>/dev/null | tr "\n" " "')"
            exit 1
          fi
          if echo "$out" | grep -q rsync-fehlt; then
            echo "::error::Auf dem Server fehlt rsync."
            exit 1
          fi

      - name: Dateien übertragen
        if: steps.check.outputs.ok == 'true'
        run: |
          # Kein --delete: Dateien, die nur auf dem Server liegen (Zugangsdaten, Anfragen, hochgeladene Grundrisse), bleiben unangetastet.
          rsync -rlptz --itemize-changes \
            --exclude '.git/' --exclude '.github/' --exclude '.gitignore' --exclude 'README.md' \
            --exclude '*.example.php' --exclude 'lib/config.php' --exclude 'zugang.php' --exclude 'data/' --exclude 'diag.php' --exclude 'intern/' --exclude 'werkzeuge/' \
            -e "ssh -i ~/.ssh/id_deploy -p $P -o StrictHostKeyChecking=yes" \
            ./ "$U@$H:$D/"

      - name: Entfernte Dateien löschen
        if: steps.check.outputs.ok == 'true'
        run: |
          # Liste in .github/entfernen.txt, nur Pfade unter assets/ oder downloads/ ohne ".."
          grep -vE '^[[:space:]]*(#|$)' .github/entfernen.txt 2>/dev/null | tr -d '\r' | while read -r f; do
            case "$f" in assets/*|downloads/*) ;; *) echo "::warning::Übersprungen: $f"; continue ;; esac
            case "$f" in *..*) continue ;; esac
            [ -e "$f" ] && { echo "Noch im Repo, nicht gelöscht: $f"; continue; }
            ssh -i ~/.ssh/id_deploy -p "$P" -o BatchMode=yes -o StrictHostKeyChecking=yes "$U@$H" "rm -f '$D/$f'" && echo "gelöscht: $f"
          done

      - name: Interner Bereich (intern.davinci-homes.de)
        if: steps.check.outputs.ok == 'true'
        env:
          SG_PATH_INTERN: ${{ secrets.SG_PATH_INTERN }}
          INTERN_SCHLUESSEL: ${{ secrets.INTERN_SCHLUESSEL }}
        run: |
          # Zielordner: Secret SG_PATH_INTERN oder neben der Website, z. B. www/intern.davinci-homes.de/public_html
          DI=$(printf '%s' "$SG_PATH_INTERN" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s#^~/##; s#/$##')
          [ -z "$DI" ] && DI=$(printf '%s' "$D" | sed -E 's#(^|/)davinci-homes\.de/#\1intern.davinci-homes.de/#')
          SSH="ssh -i ~/.ssh/id_deploy -p $P -o BatchMode=yes -o StrictHostKeyChecking=yes"
          if ! $SSH "$U@$H" "test -d '$DI'"; then
            echo "::warning::Der interne Bereich wurde nicht übertragen: Ordner $DI fehlt. Bitte in SiteGround die Subdomain intern.davinci-homes.de anlegen (oder Secret SG_PATH_INTERN setzen)."
            exit 0
          fi
          rsync -rlptz --itemize-changes \
            --exclude 'config.php' --exclude 'config.example.php' \
            --include 'daten/' --include 'daten/.htaccess' --exclude 'daten/*' \
            --include 'medien/' --include 'medien/.htaccess' --exclude 'medien/*' \
            -e "$SSH" ./intern/ "$U@$H:$DI/"
          # config.php beim ersten Mal anlegen (Einrichtungsschlüssel aus dem Secret INTERN_SCHLUESSEL)
          if ! $SSH "$U@$H" "test -f '$DI/config.php'"; then
            if [ -n "$INTERN_SCHLUESSEL" ]; then
              sed "s#HIER-EINEN-LANGEN-ZUFAELLIGEN-SCHLUESSEL-EINTRAGEN#$(printf '%s' "$INTERN_SCHLUESSEL" | tr -d '[:space:]#')#" intern/config.example.php | $SSH "$U@$H" "cat > '$DI/config.php' && chmod 640 '$DI/config.php'"
              echo "config.php angelegt."
            else
              echo "::warning::Im internen Bereich fehlt config.php. Secret INTERN_SCHLUESSEL in GitHub anlegen und erneut ausführen, oder config.example.php auf dem Server als config.php kopieren."
            fi
          fi

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/id_deploy
